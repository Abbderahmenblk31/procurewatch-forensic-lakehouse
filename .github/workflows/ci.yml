name: ProcureWatch Forensic Lakehouse CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Ingest Federal Procurement Data
      run: |
        python ingest_engine/ingest_contracts.py

    - name: Execute Forensic Models & Benford Audit
      run: |
        python models/forensic_analysis.py

    - name: Run Forensic Quality Tests
      run: |
        pytest tests/ -v
